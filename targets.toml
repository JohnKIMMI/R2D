# rosacov target definitions. One block per target; campaign, batch replay and the
# live watcher all read the same block, so the harness is defined exactly once.
#
# This file ships empty on purpose: put your own target under targets/<name>/ and
# describe it here. examples/targets.research.toml holds the 13 definitions used in
# the ROSA study (ROSARUM, paper artifact, jq, dropbear, domoticz) for reference;
# copy a block from there if your target is similar, or run with
#   ROSACOV_TARGETS=examples/targets.research.toml
# to use that file as is.
#
# Paths are container paths. scripts/launch.sh mounts this directory (R2D) at /root/R2D:
#   R2D/tools/DynamoRIO-...   -> /root/R2D/tools/...       (download, see README)
#   R2D/targets/<name>/...    -> /root/R2D/targets/...     (your binaries, seeds, dictionaries)
#   R2D/campaigns/<name>/     -> /root/R2D/campaigns/...   (results)
#   R2D/harness/*.so          -> /root/R2D/harness/...     (socket harness, built inside each container)
# Other host directories: R2D_MOUNTS="host:container ..." when running launch.sh.
# {instance} is replaced by the fuzzer instance name ("replay" for replays).

[defaults]
dynamorio = "/root/R2D/tools/DynamoRIO-Linux-11.91.20615"
timeout = 20            # replay timeout in seconds (SIGTERM first, SIGKILL 5 s later)

# ---------------------------------------------------------------------------
# Template -- copy, rename, fill in. Keys marked (optional) may be omitted.
# ---------------------------------------------------------------------------
# [targets.myserver]
# image        = "rosa-exp:0.6.0"            # docker image to run in (see README: Docker 이미지)
# rosa_version = "0.6.0"                     # "0.6.0" or "0.5.1" (decides the ROSA config schema)
# binary       = "/root/R2D/targets/myserver/backdoored/myserver"
# args         = ["-p", "8080", "-d", "/root/R2D/targets/myserver/www"]
# preload      = ["/root/R2D/harness/socketfuzz_plus.so"]   # (optional) network servers only; see README: 하네스
# env          = { DESOCK_EXIT_ON_REACCEPT = "1" }          # (optional) harness switches; used for fuzzing AND replay
# pre          = ["mkdir -p /tmp/state-{instance}"]         # (optional) shell commands run once before fuzzing/replay
# ground_truth = "/root/R2D/targets/myserver/ground-truth/myserver"   # (optional) build that prints ***BACKDOOR TRIGGERED***
# ground_truth_args = ["-p", "8080"]                        # (optional) if the ground-truth build takes different args
# markers      = ["handle_secret_command"]                  # (optional) functions to flag per input (observation, not a verdict)
# seeds        = "/root/R2D/targets/myserver/seeds"
# dictionary   = "/root/rosa/fuzzers/aflpp/aflpp/dictionaries/http.dict"   # (optional)
# afl_args     = ["-c", "0", "-a", "ascii"]                 # (optional) extra afl-fuzz arguments; "-t 5000+" for slow targets
# afl_env      = { AFL_INST_LIBS = "1" }                    # (optional) fuzzing-only environment
# timeout      = 20                                         # (optional) overrides [defaults].timeout
# isolate      = false                                      # true: no bind mount, docker cp in/out (backdoor reaches outside)
# notes        = "free text"
